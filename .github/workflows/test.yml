# This workflow runs:
# - tests, when;
#   - A push lands on develop branch
#   - A pull request is opened to develop branch
name: test

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: |
          npm install
          npm test
